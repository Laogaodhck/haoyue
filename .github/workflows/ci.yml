name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Check version consistency
        run: python version.py check
      - name: Build
        run: dotnet build Haoyue.slnx -c Release
      - name: Test
        run: dotnet test Haoyue.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  desktop:
    name: Desktop test & build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: haoyue_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: haoyue_desktop/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck & build
        run: pnpm build

  desktop-package:
    # Release-time electron-builder configuration is validated on every push to
    # main so packaging drift surfaces in CI instead of during a tagged release.
    name: Desktop package smoke (portable)
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: haoyue_desktop/pnpm-lock.yaml
      - name: Install desktop dependencies
        working-directory: haoyue_desktop
        run: pnpm install --frozen-lockfile
      - name: Build portable package (validates builder config end-to-end)
        run: python build.py --platform windows --target portable --use-current-version --skip-install --skip-tests
      - name: Verify artifact
        shell: bash
        run: ls publish/Haoyue-portable-*.zip
