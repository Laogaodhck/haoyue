name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 不指定 dotnet-version：setup-dotnet 读仓库根的 global.json（精确版本 + rollForward: disable）。
      # 原因：锁文件记录了 SDK **隐式注入**的两个包版本（Microsoft.NET.ILLink.Tasks、
      # Microsoft.AspNetCore.App.Internal.Assets），它们跟 SDK 捆绑的运行时补丁号绑定
      # （SDK 10.0.401 → 运行时 10.0.12 → 这两个包也是 10.0.12）。CI 用 10.0.x 拉到更新补丁，
      # 它们会变成 10.0.13，--locked-mode 直接 NU1004。升级 SDK 的姿势见 RELEASING.md。
      - uses: actions/setup-dotnet@v4
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Check version consistency
        run: python version.py check
      - name: Restore (locked mode)
        # 供应链（P2）：packages.lock.json 随源码提交，locked-mode 下依赖图漂移即失败。
        run: dotnet restore Haoyue.slnx --locked-mode
      - name: Build
        run: dotnet build Haoyue.slnx -c Release --no-restore
      - name: Check TS SDK is in sync with contract
        # 契约治理：contracts/daemon-contract.json 与 sdks/typescript 生成物必须与
        # DaemonContract.cs 一致（Haoyue_UpdateContract=1 重新生成快照后跑 tools/generate_ts_sdk.py）。
        run: python tools/generate_ts_sdk.py --check
      - name: Scan NuGet packages for known vulnerabilities
        # dotnet list 自身始终返回 0：这里用 JSON 输出 + 包装脚本把「发现漏洞」变成构建失败。
        run: dotnet list Haoyue.slnx package --vulnerable --include-transitive --format json | python tools/check_nuget_vulnerabilities.py
      - name: Test with coverage gate
        # 覆盖率硬门槛（coverlet.msbuild）：XPlat collector 会静默忽略 Threshold，
        # 只有 msbuild 包会在阈值未达标时让 dotnet test 非零退出。
        run: >
          dotnet test Haoyue.slnx -c Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput="${{ github.workspace }}/coverage/coverage"
          /p:Include="[haoyue_runtime]*"
          /p:Exclude="[haoyue_cli]*,[haoyue_webserver]*,[*test*]*"
          /p:Threshold=70,55
          /p:ThresholdType=line,branch
          /p:ThresholdStat=total
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: coverage/*.cobertura.xml
          if-no-files-found: error
      - name: Check packages.lock.json was not rewritten
        # L-8：本地 GPU 构建（-p:LlamaBackend=Cuda12 -r win-x64）会把 Cuda12 记为直接
        # 引用并追加 RID 段；一旦随代码提交，本 job 的 --locked-mode 立刻 NU1004。
        # 仓库基准固定为「无 RID + 默认 CPU 后端」，任何还原/构建改写都必须还原后再提交。
        shell: bash
        run: |
          if ! git diff --exit-code -- '*packages.lock.json'; then
            echo "::error::packages.lock.json 被还原/构建改写。请执行 git checkout -- '*packages.lock.json' 后重新提交（仓库基准为无 RID + 默认 CPU 后端）。"
            exit 1
          fi

  linux:
    # 跨平台护栏：daemon 的 Unix socket 路径、PathGuard 符号链接解析、Python
    # 连接器运行时都只在 Linux 上才走到真正的分支，Windows-only CI 永远发现不了。
    name: Linux build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Check version consistency
        run: python3 version.py check
      - name: Restore (locked mode)
        run: dotnet restore Haoyue.slnx --locked-mode
      - name: Build
        run: dotnet build Haoyue.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Haoyue.slnx -c Release --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TS SDK integration test
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test

  connectors:
    name: Connector server tests (python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check --no-input "pytest>=8"
      - name: Test bundled local MCP server
        # 内置本地服务器以 python 执行，是连接器的真实执行面；逻辑正确性此前没有任何
        # 测试覆盖（仅由 connectors/SHA256SUMS 兜住完整性）。
        run: python -m pytest connectors/servers/tests -q
      - name: Check connector checksums are in sync
        # 改动 connectors/servers/*.py 或任一 connector.json 后必须重新生成清单，
        # 否则运行时 ConnectorIntegrity.Verify 会拒绝安装（哈希不一致）。
        run: python tools/generate_connector_checksums.py --check

  desktop:
    name: Desktop test & build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: haoyue_desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: haoyue_desktop/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # 只对生产依赖设 high 门槛（dev 链的告警不阻塞），发现高危即 CI 失败。
        run: pnpm audit --prod --audit-level high
      - name: Test
        run: pnpm test
      - name: Typecheck & build
        run: pnpm build

  desktop-package:
    # Release-time electron-builder configuration is validated on every push to
    # main so packaging drift surfaces in CI instead of during a tagged release.
    name: Desktop package smoke (portable)
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: haoyue_desktop/pnpm-lock.yaml
      - name: Install desktop dependencies
        working-directory: haoyue_desktop
        run: pnpm install --frozen-lockfile
      - name: Build portable package (validates builder config end-to-end)
        run: python build.py --platform windows --target portable --use-current-version --skip-install --skip-tests
      - name: Verify artifact
        shell: bash
        run: ls publish/Haoyue-portable-*.zip
      # 7.7：与 release 作业同一探活口径——便携包解压实际启动并存活 30s，
      # 让「构建成功但启动即崩」在每次 push 就暴露，而不是等到打 tag。
      - name: Smoke test portable package (launch + stay alive 30s)
        shell: pwsh
        run: |
          $zip = Get-ChildItem publish/Haoyue-portable-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath smoke/portable
          $exe = Get-ChildItem smoke/portable -Recurse -Filter "Haoyue.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Haoyue.exe not found in the portable package" }
          $proc = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          if ($proc.HasExited) { Write-Error "desktop app exited within 30s of launch (exit code $($proc.ExitCode))" }
          Write-Host "desktop app alive after 30s (pid $($proc.Id)) — smoke passed"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
